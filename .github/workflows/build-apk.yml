name: Build Patchi APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Install Dependencies
        run: |
          bun install

      - name: Build Web App
        run: |
          bun run build

      - name: Sync Capacitor Android
        run: |
          # If android directory does not exist, add it
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Ensure Gradle Wrapper Executable
        run: |
          chmod +x android/gradlew

      - name: Compile Debug APK
        working-directory: ./android
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Patchi.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Patchi-APK
          path: android/app/build/outputs/apk/debug/Patchi.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish Direct APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: latest
          name: "Patchi Latest Build"
          files: android/app/build/outputs/apk/debug/Patchi.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
